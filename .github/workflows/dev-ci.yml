# .github/workflows/api-ci-build.yml
name: API CI & Docker Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) Cache NuGet packages
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/Botify.API/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # 3) Install .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # 4) Restore dependencies
      - name: dotnet restore
        run: dotnet restore src/Botify.API/Botify.API.csproj

      # 5) Build in Release
      - name: dotnet build
        run: dotnet build src/Botify.API/Botify.API.csproj --configuration Release --no-restore

      # 6) Publish the API
      - name: dotnet publish
        run: |
          dotnet publish src/Botify.API/Botify.API.csproj \
            --configuration Release \
            --output ./publish

      # 7) Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 8) Build Docker image
      - name: Build Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: Dockerfile
          push: false
          tags: |
            botify-api:latest
            botify-api:${{ github.sha }}
