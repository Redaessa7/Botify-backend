version: '3.9'

services:
  botify-api:
    container_name: botify-api
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "9092:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80

      # Database
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=BotifyDb;User=sa;Password=YourStrong@Password1;TrustServerCertificate=True;MultipleActiveResultSets=True

      # Redis
      - ConnectionStrings__Redis=redis:6379

      # JWT settings
      - JWTOptions__Issuer=https://api.botify.com
      - JWTOptions__Audience=https://botify.com
      - JWTOptions__TokenExpirationInMinutes=20
      - JWTOptions__RefreshTokenExpirationInDays=7
      - JWTOptions__SecurityKey=e2c940f58ca8e95620b3268b9396ba06f870aae066959a55397d7b8b9a8696d5

      # SMTP settings
      - SmtpSettings__Host=smtp.gmail.com
      - SmtpSettings__Port=587
      - SmtpSettings__EnableSsl=true
      - SmtpSettings__From=teamaramm@gmail.com
      - SmtpSettings__Username=teamaramm@gmail.com
      - SmtpSettings__Password=txde ajxj qubw fzbt

      # Serilog Seq sink
      - Serilog__WriteTo__1__Name=Seq
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341

    depends_on:
      - sqlserver
      - seq
      - redis
    networks:
      - botify-net
    restart: on-failure

  sqlserver:
    container_name: botify-sql
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Password1
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - botify-net
    restart: always

  seq:
    image: datalust/seq:latest
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seq-data:/data
    networks:
      - botify-net
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - botify-net
    restart: unless-stopped

volumes:
  sqlserver-data: {}
  seq-data: {}

networks:
  botify-net:
    driver: bridge
